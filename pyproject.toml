[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trinetra"
version = "0.0.1-phase0"
description = "Passive AI-based network threat detection for unidirectional IP traffic (SIH 2026 PS 26145)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - SIH 2026 internal"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "dpkt>=1.9.8",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "python-netflow>=0.10.0",
    "orjson>=3.9.0",
    "structlog>=24.1.0",
    "tomli>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-cryptography",
]
benchmark = [
    "polars>=0.20.0",
    "rich>=13.0.0",
]

[project.scripts]
trinetra = "trinetra.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
