version: "3.9"

services:
  # Trinetra sensor backend (Phase 0 scaffold — no live ingest yet)
  trinetra-sensor:
    build:
      context: .
      dockerfile: docker/Dockerfile.sensor
    container_name: trinetra-sensor
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:ro          # source code (read-only in container)
      - ./data:/app/data                   # persistent data: ledger, fixtures, signatures
      - ./config:/app/config:ro            # enclave config files
    environment:
      - TRINETRA_ENV=development
      - TRINETRA_SENSOR_ID=NTRO-ENCLAVE-DEV-01
      - TRINETRA_OLLAMA_ENABLED=false
    networks:
      - enclave-net
    # NOTE: No external port mappings for ingest — sensor is receive-only.
    # Dashboard WebSocket is exposed only within enclave-net.
    ports:
      - "127.0.0.1:8765:8765"             # SOC dashboard WebSocket (localhost only)

  # SOC Dashboard frontend (Phase 3 — placeholder)
  trinetra-dashboard:
    image: node:20-alpine
    container_name: trinetra-dashboard
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
    command: ["echo", "Dashboard placeholder — activate in Phase 3"]
    networks:
      - enclave-net

  # Optional: Local Ollama LLM for narration (disabled by default)
  # Activate by setting TRINETRA_OLLAMA_ENABLED=true and uncommenting below.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: trinetra-ollama
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   networks:
  #     - enclave-net
  #   # No external ports — ollama is accessed only inside enclave-net.

networks:
  enclave-net:
    driver: bridge
    internal: true            # Enclave network is isolated — no external routing.

volumes:
  ollama_models:
